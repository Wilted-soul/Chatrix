<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home · Chatrix</title>
<link rel="icon" type="image/png" href="chatrix-icon.png">
<link rel="apple-touch-icon" href="chatrix-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:var(--ink);--accent-ink:var(--bg);--bg:#f6f6f4;--card:#fff;--ink:#0a0a0a;--mute:#6b6b6b;--line:#dcdcd8;--field:#fafaf8;--btn:#0a0a0a;--btn-ink:#fff;--err:#b3261e;--ok:#1f6b3a;--mine:#0a0a0a;--mine-ink:#fff}
:root[data-theme="dark"]{--bg:#050505;--card:#0f0f0f;--ink:#f5f5f5;--mute:#9a9a9a;--line:#2a2a2a;--field:#151515;--btn:#f5f5f5;--btn-ink:#0a0a0a;--err:#ff7b72;--ok:#6fd08c;--mine:#f5f5f5;--mine-ink:#0a0a0a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background-color .4s,color .4s;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#boot{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50}
#boot i{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.demo{background:var(--ink);color:var(--bg);text-align:center;font-size:12.5px;padding:6px 12px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:20px;max-width:1380px;margin:0 auto;padding:16px;min-height:calc(100vh - 30px)}
.side,.right{position:sticky;top:16px;align-self:start;height:calc(100vh - 62px);display:flex;flex-direction:column;gap:6px}
.right{overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px;letter-spacing:-.04em;padding:4px 10px 14px}
.brand svg{width:34px;height:34px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.tabs button{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;background:none;border-radius:14px;color:var(--mute);text-align:left;transition:background .2s,color .2s}
.nav button:hover{background:var(--line);color:var(--ink)}
.nav button[aria-current=page],.tabs button[aria-current=page]{background:var(--accent);color:var(--accent-ink)}
.badge{margin-left:auto;background:var(--err);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.me small,.sub{color:var(--mute);font-size:12.5px;display:block}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;position:relative}
.av.on::after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--card)}
.sm{width:34px;height:34px;font-size:12px}
main{min-width:0}
.top{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.search{flex:1;position:relative}
.search input{width:100%;height:44px;padding:0 14px 0 40px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.search .ic{position:absolute;left:13px;top:12px;color:var(--mute)}
.search input:focus{outline:none;border-color:var(--ink)}
.drop{position:absolute;top:50px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;z-index:20}
.drop button,.menu button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 10px;border:0;background:none;border-radius:10px;text-align:left}
.drop button:hover,.menu button:hover{background:var(--line)}
.icb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;position:relative;overflow:hidden}
.icb .badge{position:absolute;top:2px;right:2px;margin:0}
.theme svg{position:absolute;transition:transform .6s cubic-bezier(.5,1.6,.4,1),opacity .35s}
.theme .moon{opacity:0;transform:rotate(-120deg) scale(.3)}
:root[data-theme="dark"] .theme .sun{opacity:0;transform:rotate(120deg) scale(.3)}
:root[data-theme="dark"] .theme .moon{opacity:1;transform:none}
.pw{position:relative}
.menu{position:absolute;right:0;top:50px;width:200px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;z-index:20}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;transition:background-color .4s,border-color .4s}
h2{font-size:22px;letter-spacing:-.03em;margin:0 0 14px}
h3{font-size:13px;margin:0 0 10px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:12px;align-items:center}
.row+.row{margin-top:12px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stories{display:flex;gap:14px;overflow-x:auto;padding-bottom:4px}
.story{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;min-width:64px}
.ring{padding:3px;border-radius:50%;border:2px solid var(--accent)}
.ring.seen{border-color:var(--line)}
.ring .av{width:52px;height:52px;border:2px solid var(--card)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick button,.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px;display:flex;gap:8px;align-items:center;justify-content:center;font-weight:500;transition:border-color .2s,transform .15s}
.quick button:hover,.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.s{padding:7px 12px;font-size:13px;border-radius:10px}
.acts{display:flex;gap:6px;margin-top:10px}
.acts button{border:0;background:none;display:flex;gap:6px;align-items:center;padding:6px 10px;border-radius:10px;color:var(--mute)}
.acts button:hover{background:var(--line);color:var(--ink)}
.acts .liked{color:var(--err)}.acts .liked .ic{fill:currentColor}
.media{height:180px;border-radius:14px;margin-top:10px;background:linear-gradient(135deg,var(--line),var(--field));display:grid;place-items:center;color:var(--mute)}
.skel{height:90px;border-radius:14px;background:linear-gradient(90deg,var(--line),var(--field),var(--line));background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}
.chat{display:grid;grid-template-columns:260px 1fr;gap:14px;height:calc(100vh - 150px);min-height:420px}
.chat .card{margin:0;overflow:auto}
.clist button{width:100%;display:flex;gap:10px;align-items:center;border:0;background:none;padding:9px;border-radius:12px;text-align:left}
.clist button:hover,.clist button[aria-current=true]{background:var(--line)}
.win{display:flex;flex-direction:column;padding:0!important}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:72%;padding:9px 13px;border-radius:18px;background:var(--field);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px}
.m.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-radius:18px;border-bottom-right-radius:5px}
.m small{display:block;opacity:.6;font-size:11px}
.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.compose textarea{flex:1;resize:none;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:10px 12px;font:inherit}
.compose textarea:focus{outline:none;border-color:var(--ink)}
.cgrid{display:grid;grid-template-columns:320px 1fr;gap:14px;align-items:start}
.cgrid>.card{margin-bottom:0}
.cgrid .win{height:min(76vh,680px);overflow:hidden}
.clc{padding:12px!important}.clc h3{margin:4px 6px 10px}
.clc .clist{display:flex;flex-direction:column;gap:2px;max-height:min(68vh,600px);overflow:auto}
.clc .clist button{padding:10px;border-radius:14px;transition:background .15s}
.clt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}.clt small{font-size:11px;color:var(--mute)}
.cdot{width:9px;height:9px;border-radius:99px;background:var(--accent)}
.clist .cu b{font-weight:800}.clist .cu small.sub{color:var(--ink);font-weight:600}
.chd{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.cbk{display:none}
.cgrid .msgs{padding:14px 14px 8px;gap:2px}
.cgrid .m{max-width:78%;padding:9px 13px;border-radius:20px;border-bottom-left-radius:6px;font-size:15px;line-height:1.38;margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
.cgrid .m.me{border-radius:20px;border-bottom-right-radius:6px}
.cgrid .m:not(.f){border-top-left-radius:6px}
.cgrid .m.me:not(.f){border-top-left-radius:20px;border-top-right-radius:6px}
.cgrid .m.f{margin-top:10px}.cgrid .m.pend{opacity:.7}
.cgrid .m small{display:block;margin-top:3px;font-size:10.5px;opacity:.65;text-align:right}
.cgrid .m.nw{animation:cin .18s ease both}
@keyframes cin{from{opacity:0;transform:translateY(6px)}}
.cday{align-self:center;margin:12px 0 4px}.cday span{font-size:11px;color:var(--mute);background:var(--field);border:1px solid var(--line);padding:3px 10px;border-radius:99px}
.cgrid .compose{padding:10px 12px;gap:8px;align-items:flex-end;border-top:1px solid var(--line)}
.cbox{flex:1;background:var(--field);border:1px solid var(--line);border-radius:22px;padding:3px 14px;transition:border-color .15s,box-shadow .15s}
.cbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.cgrid .cbox textarea,.cgrid .cbox textarea:focus{width:100%;border:0;background:none;resize:none;height:auto;min-height:34px;max-height:120px;padding:7px 0;outline:none;border-radius:0;color:var(--ink);font:inherit;line-height:1.35;scrollbar-width:none}
.cbox textarea::-webkit-scrollbar{display:none}
.csend{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;padding:0;border:0;background:var(--accent);color:var(--accent-ink);transition:transform .15s,opacity .15s}
.csend:disabled{opacity:.35}.csend:not(:disabled):active{transform:scale(.9)}
.cempty{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px;color:var(--mute)}
.cempty b{color:var(--ink);font-size:17px}.cempty .em{font-size:40px;line-height:1}
.cchip{border:1px solid var(--line);background:var(--field);color:var(--ink);padding:8px 16px;border-radius:99px;font:inherit;margin-top:6px}
#nav [data-go="chats"].un,#tabs [data-go="chats"].un{position:relative}
#nav [data-go="chats"].un::after,#tabs [data-go="chats"].un::after{content:"";position:absolute;top:10px;right:12px;width:9px;height:9px;border-radius:99px;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
#tabs [data-go="chats"].un::after{top:6px;right:calc(50% - 20px)}
@media(prefers-reduced-motion:reduce){.cgrid .m.nw{animation:none}}
.cbox{display:flex;align-items:flex-end;gap:6px}
.ctool{background:none;border:0;font-size:22px;line-height:1;padding:6px 2px;flex:none;margin-bottom:3px;border-radius:10px;color:var(--ink)}
.ctool.on{background:var(--line)}
.gifb{font-size:11px;font-weight:700;letter-spacing:.04em;border:1.5px solid var(--mute);border-radius:6px;padding:2px 5px;margin-bottom:9px;color:var(--mute)}
.gifb.on{border-color:var(--ink);color:var(--ink);background:none}
.cpanel{height:260px;border-top:1px solid var(--line);display:flex;flex-direction:column;background:var(--card)}.cpanel[hidden]{display:none}
.etabs{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.etabs button{border:0;background:none;font-size:20px;padding:6px 10px;border-radius:10px}.etabs .on{background:var(--line)}
.egrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));padding:8px;gap:2px;align-content:start}
.egrid button{border:0;background:none;font-size:26px;padding:4px;border-radius:10px;line-height:1.2}.egrid button:hover{background:var(--line)}
.gsearch{padding:8px;flex:none}
.gsearch input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:0 12px;font-size:16px}
.gsearch input:focus{outline:none;border-color:var(--accent)}
.ggrid{flex:1;overflow:auto;padding:0 8px;columns:2;column-gap:6px}
.ggrid button{display:block;width:100%;border:0;background:none;padding:0;margin-bottom:6px;border-radius:10px;overflow:hidden;break-inside:avoid}
.ggrid img{width:100%;display:block;background:var(--line);border-radius:10px}
.ggrid p{column-span:all}
.gfoot{text-align:center;font-size:10.5px;color:var(--mute);padding:4px;border-top:1px solid var(--line);font-weight:600;letter-spacing:.06em;text-transform:uppercase;flex:none}
.cedit{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--mute);background:var(--field)}.cedit[hidden]{display:none}
.cgrid .m{cursor:pointer}
.cgrid .m.sel{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
.cgrid .m.gifm{padding:4px;background:none!important;border:0!important}
.m .gif{display:block;max-width:100%;object-fit:cover;border-radius:16px;background:var(--line)}
.cgrid .m.jumbo{font-size:44px;line-height:1.15;padding:2px 8px;background:none!important;border:0!important;color:var(--ink)}
.m.jumbo small,.m.gifm small{color:var(--mute)!important;opacity:1!important}
.cgrid .m .ed{font-size:11px;opacity:.6;font-style:normal;margin-left:4px}
.mact{display:flex;gap:6px;align-self:flex-start;margin:2px 4px 6px;animation:cin .15s ease both}.mact.me{align-self:flex-end}
.mact button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:500}
.mact button.del{color:var(--err)}
@media(max-width:720px){.cpanel{height:min(260px,38dvh)}}
@media(max-width:720px){.cgrid{grid-template-columns:1fr}.cgrid.open>.clc{display:none}.cgrid:not(.open)>.win{display:none}.cbk{display:inline-flex}.cgrid .win{height:calc(100dvh - 200px)}}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.vgrid .media{height:240px;margin:0}
.field{display:block;margin-bottom:12px;font-weight:500;font-size:13px}
.field input,.field textarea{display:block;width:100%;margin-top:5px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:10px 12px;font:inherit}
.tabs{display:none}
.view{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.ov{position:fixed;inset:0;background:#000;z-index:60;display:none;place-items:center;color:#fff}
.ov.on{display:grid}
.ov .bar{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;height:3px;background:#fff3;border-radius:3px}
.ov .bar i{display:block;height:100%;width:0;background:#fff;border-radius:3px}
.ov p{font-size:26px;max-width:80%;text-align:center;font-weight:600}
.ov .x{position:absolute;top:calc(26px + env(safe-area-inset-top,0px));right:16px;background:none;border:0;color:#fff}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:70}
#toast.on{opacity:1}
.reels{height:calc(100vh - 140px);max-width:420px;margin:0 auto;overflow-y:scroll;scroll-snap-type:y mandatory;border-radius:22px;scrollbar-width:none;background:#000}
.reels::-webkit-scrollbar{display:none}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;color:#fff;overflow:hidden}
.reel .pi{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .2s;pointer-events:none}
.reel .pi .ic{width:64px;height:64px}
.reel.paused .pi{opacity:.85}
.reel .side2{position:absolute;right:10px;bottom:90px;display:flex;flex-direction:column;align-items:center;gap:18px}
.avw{position:relative;margin-bottom:10px}
.avw .av{width:48px;height:48px;background:#fff;color:#000;border:2px solid #fff}
.plus{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;border:0;background:#fff;color:#000;font-weight:700;line-height:22px;padding:0;transition:transform .2s,background .2s}
.plus:hover{transform:translateX(-50%) scale(1.15)}
.plus.ok{background:#2a2a2a;color:#fff;border:1.5px solid #fff}
.ab{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600}
.ab .ic{width:32px;height:32px;filter:drop-shadow(0 1px 3px #0008);transition:transform .2s}
.ab:active .ic{transform:scale(1.3)}
.ab.liked{color:#ff5a6a}.ab.liked .ic{fill:currentColor}
.reel .cap{position:absolute;left:14px;right:78px;bottom:18px;text-shadow:0 1px 4px #000a}
.reel .cap p{margin:2px 0 0}
.pb{position:absolute;left:0;right:0;bottom:0;height:3px;background:#fff3}
.pb i{display:block;height:100%;width:0;background:#fff}
@keyframes pb{to{width:100%}}
.stats{display:flex;justify-content:center;gap:34px;margin:14px 0}
.stats b{display:block;font-size:20px}.stats small{color:var(--mute)}
.ptabs{display:flex;gap:6px;margin-bottom:12px}
.ptabs button{flex:1;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:500}
.ptabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(460px,100%);height:62vh;background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;z-index:55;display:flex;flex-direction:column}

.banner{height:140px;background:var(--line) center/cover no-repeat}

.seg{display:flex;gap:8px}
.seg button{flex:1;display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);transition:background .2s,border-color .2s}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.swl{display:flex;flex-wrap:wrap;gap:12px}

.swb[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:3px}
.swb.mono{background:linear-gradient(135deg,#0a0a0a 50%,#fff 50%)}
.swb.cust{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.swb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.ov .stage{position:relative;width:min(440px,100%);height:100%}
.vbody{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.vbody img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.vbody p.cap{position:absolute;left:0;right:0;bottom:80px;font-size:18px;text-align:center;font-weight:500;background:linear-gradient(transparent,#0009)}
.bars{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;gap:4px;z-index:3}

function renderCallHistory(){
  var el=$('callList'); if(!el) return;
  firebase.firestore().collection('calls')
    .where('participants','array-contains',S.uid).limit(50).get()
    .then(function(snap){
      var items=snap.docs.map(function(d){var x=d.data();x.id=d.id;return x})
        .filter(function(c){return c.status && c.status!=='ringing' && c.status!=='accepted'})
        .sort(function(a,b){
          var ta=a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0;
          var tb=b.createdAt&&b.createdAt.toMillis?b.createdAt.toMillis():0;
          return tb-ta;
        });
      if(!items.length){ el.innerHTML=empty('No calls yet','Calls you make and receive will appear here.'); return; }
      el.innerHTML='<div class="card" style="padding:6px">'+items.map(callRow).join('')+'</div>';
    }).catch(function(e){ el.innerHTML=empty('Couldn’t load calls', e.code||'check Firestore rules'); });
}
function callRow(c){
  var outgoing=c.callerId===S.uid, peer=outgoing?c.calleeName:c.callerName,
      peerId=outgoing?c.calleeId:c.callerId,
      icon=ic(c.type==='video'?'cam':'phone'), arrow=ic(outgoing?'arrowout':'arrowin'),
      when=c.createdAt&&c.createdAt.toMillis?ago(c.createdAt.toMillis()):'',
      dur=c.duration?Math.floor(c.duration/60)+'m '+String(c.duration%60).padStart(2,'0')+'s':'',
      label=c.status==='missed'?'Missed':c.status==='declined'?'Declined':c.status==='completed'?(dur||'Call'):(c.status||'Call');
  return '<div class="row call-row">'+
    '<button class="plink" data-pu="'+esc(peerId)+'">'+av(peer||'?','sm')+
    '<span class="grow"><b class="ell">'+esc(peer||'Unknown')+'</b>'+
    '<small class="sub">'+arrow+icon+' '+esc(label)+(when?' · '+esc(when):'')+'</small></span></button>'+
    '<button class="btn s p" data-call="'+esc(peerId)+'" data-call-type="'+esc(c.type||'audio')+'">Call back</button>'+
  '</div>';
}

/* =================== CALLS: WebRTC + Firestore signaling =================== */
(function(){
  if(!window.firebase){ console.warn('[Chatrix Calls] Firebase not loaded'); return; }

  var ICE={iceServers:[
    {urls:'stun:stun.l.google.com:19302'},
    {urls:'stun:stun1.l.google.com:19302'},
    {urls:'stun:stun.cloudflare.com:3478'},
    /* TURN relay: required when STUN alone can't connect (mobile data, strict NATs).
       Free option: sign up at metered.ca (Open Relay) and paste your credentials below. */
    {urls:['turn:YOUR_TURN_HOST:80','turn:YOUR_TURN_HOST:443','turns:YOUR_TURN_HOST:443?transport=tcp'],
     username:'YOUR_TURN_USERNAME', credential:'YOUR_TURN_CREDENTIAL'}
  ]};
  var C={pc:null,local:null,remote:null,session:null,roomRef:null,roomUnsub:null,
         iceUnsub:null,inboxUnsub:null,peerId:null,peerName:null,type:'video',role:null,
         active:false,startedAt:0,incoming:null,muted:false,camOff:false,
         ringT:null,answerT:null,seenSessions:{}};
  var overlay,remoteV,localV,statusEl,peerEl,muteBtn,camBtn,incomingEl;

  function db(){ return firebase.firestore(); }

  function buildUI(){
    if(overlay) return;
    overlay=document.createElement('div');
    overlay.id='callOverlay'; overlay.className='call-overlay'; overlay.hidden=true;
    overlay.innerHTML='<div class="call-stage">'+
      '<video id="callRemote" class="call-remote" autoplay playsinline></video>'+
      '<video id="callLocal" class="call-local" autoplay playsinline muted></video>'+
      '<div class="call-top"><b id="callPeer">—</b><small id="callStatus">Connecting…</small></div>'+
      '<div class="call-controls">'+
        '<button type="button" data-call-mute title="Mute"><svg class="ic"><use href="#i-mic"/></svg></button>'+
        '<button type="button" data-call-cam title="Camera"><svg class="ic"><use href="#i-cam"/></svg></button>'+
        '<button type="button" data-call-end class="end" title="End call"><svg class="ic"><use href="#i-hangup"/></svg></button>'+
      '</div></div>';
    document.body.appendChild(overlay);
    remoteV=overlay.querySelector('#callRemote');
    localV=overlay.querySelector('#callLocal');
    statusEl=overlay.querySelector('#callStatus');
    peerEl=overlay.querySelector('#callPeer');
    muteBtn=overlay.querySelector('[data-call-mute]');
    camBtn=overlay.querySelector('[data-call-cam]');
    overlay.querySelector('[data-call-end]').onclick=function(){endCall(false,'ended')};
    muteBtn.onclick=toggleMute;
    camBtn.onclick=toggleCam;

    incomingEl=document.createElement('div');
    incomingEl.id='callIncoming'; incomingEl.className='call-incoming'; incomingEl.hidden=true;
    incomingEl.innerHTML='<div class="ci-card">'+
      '<div class="ci-avatar"><svg class="ic"><use href="#i-phone"/></svg></div>'+
      '<b id="ciPeer">Someone</b>'+
      '<small id="ciType">Incoming call…</small>'+
      '<div class="ci-actions"><button type="button" data-ci-decline>Decline</button>'+
      '<button type="button" data-ci-accept class="accept">Accept</button></div></div>';
    document.body.appendChild(incomingEl);
    incomingEl.querySelector('[data-ci-decline]').onclick=function(){declineIncoming(false)};
    incomingEl.querySelector('[data-ci-accept]').onclick=acceptIncoming;
  }
  function setStatus(t){ if(statusEl) statusEl.textContent=t; }
  function setPeer(n){ if(peerEl) peerEl.textContent=n; }
  function setMuteBtn(){ if(muteBtn){muteBtn.innerHTML=ic(C.muted?'micoff':'mic');muteBtn.classList.toggle('on',C.muted);} }
  function setCamBtn(){ if(camBtn){camBtn.innerHTML=ic(C.camOff?'camoff':'cam');camBtn.classList.toggle('on',C.camOff);} }
  function hideIncoming(){ if(incomingEl) incomingEl.hidden=true; C.incoming=null; clearTimeout(C.ringT); }

  async function getLocal(video){
    return navigator.mediaDevices.getUserMedia(video
      ? {audio:true,video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}}}
      : {audio:true,video:false});
  }
  function newPeer(){
    var pc=new RTCPeerConnection(ICE);
    pc.ontrack=function(e){
      if(!remoteV) return;
      if(!C.remote) C.remote=new MediaStream();
      e.streams[0].getTracks().forEach(function(t){C.remote.addTrack(t)});
      remoteV.srcObject=C.remote;
      var pr=remoteV.play(); if(pr&&pr.catch) pr.catch(function(){});
    };
    pc.onicecandidate=function(e){
      if(!e.candidate || !C.roomRef || !C.role) return;
      var sub = C.role==='caller'?'callerCandidates':'calleeCandidates';
      C.roomRef.collection(sub).add(e.candidate.toJSON()).catch(function(){});
    };
    pc.onconnectionstatechange=function(){
      var st=pc.connectionState;
      if(st==='connected'){ setStatus('Connected'); if(!C.startedAt) C.startedAt=Date.now(); }
      else if(st==='disconnected'){ setStatus('Reconnecting…'); setTimeout(function(){ if(C.pc===pc && pc.connectionState==='disconnected'){ endCall(true,'failed'); } },8000); }
      else if(st==='failed'||st==='closed'){ setStatus('Call ended'); endCall(true,'failed'); }
    };
    C.pc=pc; return pc;
  }
  async function addLocal(pc){
    C.local=await getLocal(C.type==='video');
    C.local.getTracks().forEach(function(t){pc.addTrack(t,C.local)});
    if(localV) localV.srcObject=C.local;
  }
  function listenForRemoteIce(room,sub,pc){
    if(C.iceUnsub){ try{C.iceUnsub()}catch(_){} }
    C.iceUnsub=room.collection(sub).onSnapshot(function(snap){
      snap.docChanges().forEach(function(ch){
        if(ch.type!=='added') return;
        try{ pc.addIceCandidate(new RTCIceCandidate(ch.doc.data())) }catch(e){}
      });
    },function(e){ console.warn('[Chatrix Calls] ice listener',e); });
  }

  function openInbox(){
    if(C.inboxUnsub||!S.uid) return;
    C.inboxUnsub = db().collection('calls')
      .where('calleeId','==',S.uid).limit(20)
      .onSnapshot(function(snap){
        snap.docChanges().forEach(function(ch){
          if(ch.type!=='added') return;
          var d=ch.doc.data(), id=ch.doc.id;
          if(d.status!=='ringing') return;
          if(C.seenSessions[id]) return;
          if(C.active) return;
          var t=d.createdAt&&d.createdAt.toMillis?d.createdAt.toMillis():0;
          if(!t || Date.now()-t > 45000) return;
          if(!isFriend(d.callerId)) return;
          C.seenSessions[id]=true;
          handleIncoming({session:id, fromId:d.callerId, fromName:d.callerName, type:d.type});
        });
      },function(e){ console.warn('[Chatrix Calls] inbox',e); });
  }
  function handleIncoming(p){
    buildUI();
    C.incoming=p;
    document.getElementById('ciPeer').textContent=p.fromName||'Someone';
    document.getElementById('ciType').textContent=(p.type==='audio'?'Incoming audio call…':'Incoming video call…');
    incomingEl.hidden=false;
    clearTimeout(C.ringT);
    C.ringT=setTimeout(function(){ if(C.incoming&&C.incoming.session===p.session) declineIncoming(true); },30000);
  }
  function declineIncoming(auto){
    if(!C.incoming) return;
    var sid=C.incoming.session;
    hideIncoming();
    db().collection('calls').doc(sid).update({status:auto?'missed':'declined'}).catch(function(){});
  }

  async function startCall(uid,type){
    if(C.active){ toast('You’re already on a call'); return; }
    if(!isFriend(uid)){ toast('You can call people who follow you back'); return; }
    var p=(S.people||[]).filter(function(x){return x.uid===uid})[0];
    if(!p){
      try{ var ud=await db().doc('users/'+uid).get();
           if(ud.exists) p={uid:uid,name:ud.data().name||'Friend'}; }catch(e){}
    }
    if(!p){ toast('Person not found'); return; }
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast('Your browser can’t make calls'); return; }
    if(location.protocol!=='https:' && location.hostname!=='localhost'){ toast('Cant Call now'); return; }

    C.active=true; C.role='caller'; C.type=type||'video';
    C.peerId=uid; C.peerName=p.name||'Friend'; C.startedAt=0;
    buildUI(); overlay.hidden=false; setPeer(C.peerName); setStatus('Calling…');

    try{
      var room=db().collection('calls').doc();
      C.session=room.id; C.roomRef=room;
      await room.set({
        callerId:S.uid, callerName:S.name,
        calleeId:uid, calleeName:C.peerName,
        type:C.type, status:'ringing',
        participants:[S.uid,uid],
        offer:null, answer:null,
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),
        endedAt:null, duration:0
      });

      var pc=newPeer();
      await addLocal(pc);
      var offer=await pc.createOffer({offerToReceiveAudio:true,offerToReceiveVideo:C.type==='video'});
      await pc.setLocalDescription(offer);
      await room.update({offer:{type:'offer', sdp:pc.localDescription.sdp}});

      var gotAnswer=false;
      C.roomUnsub=room.onSnapshot(function(snap){
        var d=snap.data(); if(!d) return;
        if(d.answer && !gotAnswer && pc.signalingState==='have-local-offer'){
          gotAnswer=true;
          pc.setRemoteDescription({type:d.answer.type, sdp:d.answer.sdp})
            .then(function(){
              setStatus('Connecting…');
              listenForRemoteIce(room,'calleeCandidates',pc);
            }).catch(function(e){ console.warn(e); });
        }
        if(d.status && ['ended','declined','missed','failed','completed'].indexOf(d.status)>-1 && C.active){
          endCall(true,'ended');
        }
      });

      C.answerT=setTimeout(function(){
        if(C.active && !C.startedAt){ toast('No answer'); endCall(true,'missed'); }
      },35000);
    }catch(e){
      console.error(e); toast('Could not start call: '+(e.message||e.name));
      endCall(true,'failed');
    }
  }

  async function acceptIncoming(){
    var inc=C.incoming; if(!inc) return;
    hideIncoming();
    C.active=true; C.role='callee'; C.type=inc.type||'video';
    C.peerId=inc.fromId; C.peerName=inc.fromName||'Friend';
    C.session=inc.session; C.startedAt=0;
    buildUI(); overlay.hidden=false; setPeer(C.peerName); setStatus('Connecting…');

    try{
      var room=db().collection('calls').doc(inc.session);
      C.roomRef=room;
      var offer=null,tries=0;
      while(!offer && tries<40){
        var snap=await room.get();
        if(!snap.exists){ toast('Caller cancelled'); return endCall(true,'missed'); }
        var d=snap.data();
        if(d.status==='ended'||d.status==='declined'||d.status==='missed'){ toast('Caller cancelled'); return endCall(true,'missed'); }
        if(d.offer) offer=d.offer;
        else await new Promise(function(r){setTimeout(r,250)});
        tries++;
      }
      if(!offer){ toast('Call failed to connect'); return endCall(true,'failed'); }

      await room.update({status:'accepted'});
      var pc=newPeer();
      await addLocal(pc);
      await pc.setRemoteDescription({type:'offer', sdp:offer.sdp});
      listenForRemoteIce(room,'callerCandidates',pc);

      var ans=await pc.createAnswer();
      await pc.setLocalDescription(ans);
      await room.update({answer:{type:'answer', sdp:pc.localDescription.sdp}});

      C.roomUnsub=room.onSnapshot(function(snap){
        var d=snap.data(); if(!d) return;
        if(d.status && ['ended','declined','missed','failed','completed'].indexOf(d.status)>-1 && C.active){
          endCall(true,'ended');
        }
      });
      setStatus('Connecting…');
    }catch(e){
      console.error(e); toast('Could not join call: '+(e.message||e.name));
      endCall(true,'failed');
    }
  }

  async function endCall(silent,reason){
    if(!C.active && !C.session){ if(overlay) overlay.hidden=true; return; }
    var dur=C.startedAt?Math.round((Date.now()-C.startedAt)/1000):0;
    var wasConnected=!!C.startedAt;
    var finalStatus = wasConnected?'completed':(reason||'missed');
    if(C.roomRef){
      try{ await C.roomRef.update({status:finalStatus, duration:dur, endedAt:firebase.firestore.FieldValue.serverTimestamp()}); }catch(e){}
    }
    cleanup(!silent);
  }
  function cleanup(showToastMsg){
    clearTimeout(C.answerT); clearTimeout(C.ringT);
    try{ if(C.roomUnsub) C.roomUnsub(); }catch(_){}
    try{ if(C.iceUnsub)  C.iceUnsub();  }catch(_){}
    C.roomUnsub=null; C.iceUnsub=null;
    if(C.pc){ try{C.pc.close()}catch(_){} C.pc=null; }
    if(C.local){ C.local.getTracks().forEach(function(t){t.stop()}); C.local=null; }
    C.remote=null; C.active=false; C.startedAt=0;
    C.session=null; C.roomRef=null; C.peerId=null; C.peerName=null; C.incoming=null;
    C.muted=false; C.camOff=false;
    if(overlay) overlay.hidden=true;
    if(remoteV) remoteV.srcObject=null;
    if(localV) localV.srcObject=null;
    if(showToastMsg) toast('Call ended');
    if(S.view==='calls') setTimeout(renderCallHistory,400);
  }
  function toggleMute(){
    if(!C.local) return;
    C.muted=!C.muted;
    C.local.getAudioTracks().forEach(function(t){t.enabled=!C.muted});
    setMuteBtn();

document.addEventListener("change",function(e){
 if(e.target.id!=="rvfile")return;var f=e.target.files[0];e.target.value="";if(!f)return;
 if(!/^video\//.test(f.type)){toast("Please choose a video file");return}
 if(f.size>25*1024*1024){toast("Replies can be up to 25 MB");return}
 var u=URL.createObjectURL(f),pv=document.createElement("video");pv.preload="metadata";
 pv.onloadedmetadata=function(){URL.revokeObjectURL(u);if(pv.duration>R.max+1){toast("Replies can be up to 30 seconds");return}rvPreview(f)};
 pv.onerror=function(){URL.revokeObjectURL(u);toast("Can’t read that video")};pv.src=u});

/* ---- push notifications ---- */
function pushSupported(){try{return window.isSecureContext&&"Notification" in window&&"serviceWorker" in navigator&&firebase.messaging&&firebase.messaging.isSupported&&firebase.messaging.isSupported()}catch(e){return false}}
function pushKey(){return "chatrix-push-"+S.uid}
function pushCard(){
 var ok=pushSupported();
 return '<div class="card" id="pushcard"><h3>Push notifications</h3>'+(ok?'<p class="sub">Get alerts for likes, comments, mentions and new followers even when Chatrix is closed.</p>'+(S.pushOn?'<button class="btn" data-push="off">Turn off</button>':'<button class="btn p" data-push="on">Turn on notifications</button>')+(Notification.permission==="denied"?'<p class="sub" style="margin-top:8px">Notifications are blocked for this site. Allow them in your browser settings, then try again.</p>':''):'<p class="sub">This browser or connection doesn’t support push notifications. Use Chrome, Edge, Firefox or Safari 16.4+ on an https address.</p>')+'</div>'}
function pushPaint(){var c=$("pushcard");if(c)c.outerHTML=pushCard()}
var _st=V.settings;V.settings=function(){return _st()+pushCard()};
function pushToken(){
 if(/YOUR_/.test(VAPID_KEY))return Promise.reject({code:"push/no-vapid-key"});
 return navigator.serviceWorker.register("firebase-messaging-sw.js").then(function(reg){return firebase.messaging().getToken({vapidKey:VAPID_KEY,serviceWorkerRegistration:reg})}).then(function(tok){
  if(!tok)throw{code:"push/no-token"};S.fcmToken=tok;
  return db().doc("users/"+S.uid+"/fcmTokens/"+tok).set({token:tok,ua:navigator.userAgent.slice(0,120),updatedAt:SV()},{merge:true}).then(function(){try{localStorage.setItem(pushKey(),"1")}catch(e){}})})}
function pushOn(){
 if(DEMO||S.uid==="demo"){toast("Demo mode. Create an account to try this.");return}
 if(!pushSupported()){toast("Push isn’t supported in this browser");return}
 if(/YOUR_/.test(VAPID_KEY)){toast("Add your Web Push (VAPID) key in the page first. See ENGAGEMENT_SETUP.md");return}
 Notification.requestPermission().then(function(p){if(p!=="granted")throw{code:"push/permission-"+p};return pushToken()}).then(function(){S.pushOn=true;pushPaint();toast("Push notifications on")}).catch(function(e){pushPaint();toast("Couldn’t turn on push: "+(e.code||e.message||"error"))})}
function pushOff(){
 var tok=S.fcmToken,p=Promise.resolve();
 try{p=firebase.messaging().deleteToken()}catch(e){}
 p.catch(function(){}).then(function(){return tok?db().doc("users/"+S.uid+"/fcmTokens/"+tok).delete():null}).catch(function(){}).then(function(){try{localStorage.removeItem(pushKey())}catch(e){}S.pushOn=false;S.fcmToken=null;pushPaint();toast("Push notifications off")})}
function initPush(){
 if(!pushSupported())return;
 var was=false;try{was=localStorage.getItem(pushKey())==="1"}catch(e){}
 if(was&&Notification.permission==="granted"){S.pushOn=true;pushToken().catch(function(){})}
 pushPaint()}


/* ---- comment replies (threads, one level deep) ---- */
S.openRep=S.openRep||{};S.cmap={};S.replyTo=null;
function rbar(){var b=$("rbar");if(!b){b=document.createElement("div");b.id="rbar";b.className="rbar";b.hidden=true;var f=document.querySelector("#cs .csf");f.parentNode.insertBefore(b,f)}return b}
function setReply(c){
 var root=c.parentId?(S.cmap[c.parentId]?c.parentId:null):c.id;
 S.replyTo={root:root,uid:c.uid,name:c.name||"User"};
 var b=rbar();b.innerHTML='Replying to <b>'+esc(S.replyTo.name)+'</b><button type="button" data-rcancel="1" aria-label="Cancel reply">\u00d7</button>';b.hidden=false;
 var ta=$("ci");ta.placeholder="Reply to "+S.replyTo.name+"\u2026";
 if(c.uid!==S.uid&&c.parentId){var p=S.people.filter(function(q){return q.uid===c.uid})[0];if(p&&p.handle&&!ta.value)ta.value=p.handle+" "}
 ta.dispatchEvent(new Event("input",{bubbles:true}));ta.focus()}
function clearReply(){S.replyTo=null;var b=$("rbar");if(b)b.hidden=true;var ta=$("ci");if(ta)ta.placeholder="Add comment\u2026"}
function threadHtml(l){
 var by={},ids={},tops=[];S.cmap={};
 l.forEach(function(c){ids[c.id]=1;S.cmap[c.id]=c});
 l.forEach(function(c){if(c.parentId&&ids[c.parentId])(by[c.parentId]=by[c.parentId]||[]).push(c);else tops.push(c)});
 return tops.map(function(c){
  var r=(by[c.id]||[]).sort(function(a,b){return ms(a.createdAt)-ms(b.createdAt)}),open=!!S.openRep[c.id];
  return cmtHtml(c)+(r.length?'<button class="rtog" data-rtog="'+esc(c.id)+'">'+(open?"Hide replies":"View "+r.length+(r.length>1?" replies":" reply"))+'</button>'+(open?'<div class="creps">'+r.map(function(x){return cmtHtml(x)}).join("")+'</div>':""):"")}).join("")}
window.threadHtml=threadHtml;
var _cmt2=window.cmtHtml;
window.cmtHtml=function(c){var h=_cmt2(c),k="</div></div></div>",i=h.lastIndexOf(k);if(i<0)return h;
 return h.slice(0,i)+'<button class="crep" type="button" data-crep="'+esc(c.id)+'">Reply</button>'+h.slice(i)};
var _oc=window.openC;window.openC=function(id){if(S.cv!==id)S.openRep={};clearReply();return _oc(id)};
var _cc2=window.closeC;window.closeC=function(){clearReply();_cc2()};
var _nv2=window.noteVerb;window.noteVerb=function(n){return n.type==="reply"?"replied to you: \u201c"+(n.text||"")+"\u201d":_nv2(n)};
document.addEventListener("click",function(e){
 var T=e.target;if(!T.closest)return;var x;
 if((x=T.closest("[data-crep]"))){e.stopPropagation();var c=S.cmap[x.dataset.crep];if(c)setReply(c);return}
 if((x=T.closest("[data-rtog]"))){e.stopPropagation();var id=x.dataset.rtog;S.openRep[id]=!S.openRep[id];var L=Object.keys(S.cmap).map(function(k){return S.cmap[k]}),sc=$("cl").scrollTop;$("cl").innerHTML=threadHtml(L);$("cl").scrollTop=sc;return}
 if(T.closest("[data-rcancel]")){e.stopPropagation();clearReply();return}
},true);

/* ---- click routing (capture so the older handler doesn't also react) ---- */
document.addEventListener("click",function(e){
 var T=e.target;if(!T.closest)return;
 var tab=T.closest("[data-home-tab]");if(tab){S.rank={};return}
 var x;
 if((x=T.closest("[data-bm]"))){e.stopPropagation();e.preventDefault();toggleBm(x.dataset.bm);return}
 if((x=T.closest("[data-xplay]"))){e.stopPropagation();xplay(x.dataset.xplay);return}
 if(T.closest("[data-xclose]")){e.stopPropagation();xclose();return}
 if((x=T.closest("[data-extech]"))){e.stopPropagation();S.exTech=S.exTech===x.dataset.extech?"":x.dataset.extech;go("explore",1);return}
 if((x=T.closest("[data-mpick]"))){e.stopPropagation();var ta=$("ci"),pos=ta.selectionStart,val=ta.value,pre=val.slice(0,pos).replace(/@[a-z0-9_]*$/i,x.dataset.mpick+" ");ta.value=pre+val.slice(pos);ta.setSelectionRange(pre.length,pre.length);ta.dispatchEvent(new Event("input",{bubbles:true}));ta.focus();return}
 if(T.closest("#cvid")){e.stopPropagation();rvOpen();return}
 if((x=T.closest("[data-rv]"))){e.stopPropagation();var a=x.dataset.rv;if(a==="cancel")rvClose();else if(a==="rec")rvRecord();else if(a==="pick")$("rvfile").click();else if(a==="send")rvSend();return}
 if((x=T.closest("[data-push]"))){e.stopPropagation();if(x.dataset.push==="on")pushOn();else pushOff();return}
},true);
document.addEventListener("keydown",function(e){if(e.key!=="Escape")return;if(!$("rvm").hidden)rvClose();if(!$("xvm").hidden)xclose()});

/* ---- start once signed in ---- */
var tries=0,iv=setInterval(function(){if(S.uid&&S.uid!=="demo"&&!DEMO){clearInterval(iv);startBm();initPush()}if(++tries>80)clearInterval(iv)},500);
})();
</script>

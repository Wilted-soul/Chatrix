<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<title>Chatrix · Connection lost</title>
<link rel="icon" type="image/png" href="/chatrix-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--black:#0a0a0a;--white:#f5f3ee;--silver:#c8c4bc;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--black);color:var(--white);font-family:'DM Sans',system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:100;opacity:.6}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
:focus-visible{outline:2px solid var(--white);outline-offset:3px;border-radius:6px}

/* NAV (same as landing page) */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:24px 48px;display:flex;align-items:center;justify-content:space-between;mix-blend-mode:difference}
.nav-logo,.footer-logo{display:inline-flex;align-items:center;gap:12px;font-family:'Syne',sans-serif;font-weight:800;color:var(--white);text-decoration:none}
.nav-logo{font-size:22px;letter-spacing:-.5px}
.logo-mark{height:30px;width:auto;display:block}
.nav-links{display:flex;gap:40px;list-style:none}
.nav-links a{font-size:13px;color:var(--silver);text-decoration:none;letter-spacing:.08em;text-transform:uppercase;transition:color .3s}
.nav-links a:hover{color:var(--white)}
.nav-cta{font-size:13px;color:var(--black);background:var(--white);padding:10px 24px;border-radius:100px;text-decoration:none;font-weight:500;letter-spacing:.02em;transition:all .3s}
.nav-cta:hover{transform:scale(1.04)}

/* HERO */
.hero{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px 24px 80px}
.bits{display:grid;grid-template-columns:repeat(19,1fr);width:100%;max-width:620px;font:500 clamp(9px,2.5vw,17px)/1.5 ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,Consolas,monospace;margin-bottom:48px;user-select:none}
.bits span{color:#1d1d1b}
.bits .on{color:var(--silver)}
.bits .dec{color:#fff;text-shadow:0 0 14px rgba(255,255,255,.9)}
.bits .hot{color:#fff;text-shadow:0 0 16px rgba(255,255,255,.85)}
.bits .lost{color:#2c2c2a;text-shadow:none}
.bits.glitch{animation:jit .22s steps(2) 1}
@keyframes jit{0%{transform:translateX(0)}30%{transform:translateX(-5px)}60%{transform:translateX(4px)}100%{transform:translateX(0)}}
.up{opacity:0;transform:translateY(24px);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(38px,7vw,84px);line-height:1;letter-spacing:-.04em;background:linear-gradient(100deg,var(--white) 35%,#6f6c66 50%,var(--white) 65%) 100% 0/260% 100% no-repeat;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:up .9s .15s cubic-bezier(.2,.8,.2,1) forwards,shine 6s 1.2s ease-in-out infinite;opacity:0;transform:translateY(24px)}
@keyframes shine{0%,30%{background-position:100% 0}70%,100%{background-position:0 0}}
.sub{margin:22px auto 40px;color:var(--silver);font-weight:300;font-size:18px;line-height:1.6;max-width:30em;animation-delay:.3s}
.actions{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;animation-delay:.45s}
.btn-primary{display:inline-flex;align-items:center;background:var(--white);color:var(--black);padding:16px 36px;border-radius:100px;font:500 15px 'DM Sans',sans-serif;text-decoration:none;border:0;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.btn-primary:hover{transform:scale(1.05) translateY(-2px)}
.btn-secondary{color:var(--silver);font-size:15px;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.2);padding-bottom:2px;transition:color .3s}
.btn-secondary:hover{color:var(--white)}
.status{margin-top:44px;font:400 13px ui-monospace,Menlo,Consolas,monospace;color:rgba(255,255,255,.4);display:flex;align-items:center;gap:10px;animation-delay:.6s}
.status i{width:8px;height:8px;border-radius:50%;background:#666}
.status.live i{background:var(--white);box-shadow:0 0 10px rgba(255,255,255,.7);animation:pulse 2s ease-in-out infinite}
.status em{font-style:normal;animation:blink 1s steps(1) infinite}
@keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}

/* FOOTER (same as landing page) */
footer{position:relative;z-index:2;padding:48px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;row-gap:40px;background:var(--black)}
.footer-logo{font-size:20px}
.footer-links{display:flex;gap:32px;list-style:none}
.footer-links a{font-size:13px;color:rgba(255,255,255,.35);text-decoration:none;transition:color .3s}
.footer-links a:hover{color:var(--white)}
.footer-copy{font-size:12px;color:rgba(255,255,255,.2)}
.footer-brand{flex-basis:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:40px;border-top:1px solid rgba(255,255,255,.06)}
.footer-brand span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.25)}
.footer-brand img{height:30px;width:auto;opacity:.7;user-select:none}

@media(max-width:900px){nav{padding:20px 24px}.nav-links{display:none}footer{padding:40px 24px}}
@media(prefers-reduced-motion:reduce){.up,h1{animation:none;opacity:1;transform:none}h1{-webkit-text-fill-color:var(--white);background:none}.status i,.status em,.bits.glitch{animation:none}}
</style>
</head>

<script>
(function(){
  var $=function(i){return document.getElementById(i)},RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var rnd=function(){return Math.random()<.5?"0":"1"};

  /* ---- binary rain background ---- */
  var cv=$("rain"),cx=cv.getContext("2d"),W,H,FS=16,drops=[],last=0;
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;drops=[];for(var i=0;i<Math.ceil(W/FS);i++)drops.push(-Math.random()*60)}
  function rain(t){
    if(!document.hidden&&t-last>45){last=t;
      cx.fillStyle="rgba(10,10,10,.14)";cx.fillRect(0,0,W,H);cx.font="14px ui-monospace,Menlo,monospace";
      for(var i=0;i<drops.length;i++){
        cx.fillStyle=Math.random()<.03?"rgba(255,255,255,.55)":"rgba(255,255,255,.12)";
        cx.fillText(rnd(),i*FS,drops[i]*FS);
        if(drops[i]*FS>H&&Math.random()>.975)drops[i]=0;
        drops[i]+=.55}}
    requestAnimationFrame(rain)}
  size();addEventListener("resize",size);
  if(RM){cx.fillStyle="rgba(255,255,255,.07)";cx.font="14px monospace";for(var y=0;y<H;y+=FS*2)for(var x=0;x<W;x+=FS*2)cx.fillText(rnd(),x,y)}else requestAnimationFrame(rain);

  /* ---- big pixel word made of digits ---- */
  var G={"4":["10010","10010","10010","11111","00010","00010","00010"],
         "0":["01110","10001","10011","10101","11001","10001","01110"],
         "O":["01110","10001","10001","10001","10001","10001","01110"],
         "F":["11111","10000","11110","10000","10000","10000","10000"],
         "E":["11111","10000","11110","10000","10000","10000","11111"],
         "R":["11110","10001","10001","11110","10100","10010","10001"]};
  var ST={nf:{w:"404",h:"Page not found",p:"That page doesn't exist or has moved. Check the link, or head back to Chatrix.",b:"Back to Chatrix",href:"/"},
          off:{w:"OFF",h:"You're offline",p:"Chatrix can't reach the internet right now. Check your connection and it will reconnect on its own.",b:"Try again"},
          err:{w:"ERR",h:"Something went wrong",p:"Chatrix hit an error loading this page. It's not you. Try again in a moment.",b:"Reload"}};
  var bits=$("bits"),cells=[],cur,t0,lossy,timer;

  function build(word){
    bits.innerHTML="";cells=[];
    for(var r=0;r<7;r++)for(var c=0;c<19;c++){
      var gi=Math.floor(c/6),cc=c%6,on=cc<5&&G[word[gi]]&&G[word[gi]][r][cc]==="1",s=document.createElement("span");
      s.textContent=rnd();bits.appendChild(s);
      cells.push({el:s,on:on,c:c,ch:rnd(),d:c*55+r*18+Math.random()*120})}}

  function tick(){
    var now=performance.now()-t0,sw=(now/1000)*9%34-5;
    for(var i=0;i<cells.length;i++){
      var k=cells[i],el=k.el;
      if(!k.on){if(Math.random()<.03)el.textContent=rnd();continue}
      var st=now-k.d;
      if(st<0){el.textContent=rnd();el.className="";continue}
      if(st<560){el.textContent=rnd();el.className="dec";continue}
      el.textContent=k.ch;
      el.className="on"+(Math.abs(k.c-sw)<1.7?" hot":"")+(lossy&&Math.random()<.05?" lost":"")}
    if(lossy&&Math.random()<.04){bits.classList.remove("glitch");void bits.offsetWidth;bits.classList.add("glitch")}}

  function settle(){for(var i=0;i<cells.length;i++){var k=cells[i];k.el.textContent=k.ch;k.el.className=k.on?"on":""}}

  function show(k){
    cur=k;var s=ST[k];lossy=k!=="nf";
    build(s.w);bits.setAttribute("aria-label",s.h);
    $("h").textContent=s.h;$("p").textContent=s.p;
    var g=$("go");g.textContent=s.b;g.href=s.href||"#";g.onclick=s.href?null:function(e){e.preventDefault();location.reload()};
    document.title="Chatrix · "+s.h;
    var st=$("st");st.className="status up"+(navigator.onLine?" live":"");st.children[1].textContent=navigator.onLine?"Connected":"No connection";
    clearInterval(timer);t0=performance.now();
    if(RM)settle();else{tick();timer=setInterval(tick,70)}}

  function pick(){return !navigator.onLine?"off":(/[?&]e(=|&|$)/.test(location.search)?"err":"nf")}
  show(pick());
  addEventListener("offline",function(){show("off")});
  addEventListener("online",function(){var st=$("st");st.className="status up live";st.children[1].textContent="Back online";if(cur==="off")setTimeout(function(){location.reload()},700)});
})();
</script>
